  redis:
    host: 192.168.1.24
    port: 6379
    password:
    # 连接超时时间（毫秒）
    timeout: 10000
    jedis:
      pool:
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池中的最小空闲连接
          min-idle: 10
          # 连接池最大连接数（使用负值表示没有限制）
          max-active: -1
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1