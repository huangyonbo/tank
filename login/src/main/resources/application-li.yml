server:
  session-timeout: 1800
  port: 8811
syspro:
  uploadPath: /opt/uploaded_files/
  username: admin
  password: 123456
logging:
  level:
    root: info
forest:
  bean-id: forestConfiguration # 在spring上下文中bean的id, 默认值为forestConfiguration
  backend: okhttp3             # 后端HTTP API： 默认使用：okhttp3，也可以替换成：httpclient
  max-connections: 1000        # 连接池最大连接数，默认值为500
  max-route-connections: 500   # 每个路由的最大连接数，默认值为500
  timeout: 3000                # 请求超时时间，单位为毫秒, 默认值为3000
  connect-timeout: 3000        # 连接超时时间，单位为毫秒, 默认值为2000
  retry-count: 0               # 请求失败后重试次数，默认为0次不重试
  ssl-protocol: SSLv3          # 单向验证的HTTPS的默认SSL协议，默认为SSLv3
  logEnabled: true             # 打开或关闭日志，默认为true，也可以在单个方法上加注解是否开启：@LogEnabled
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: mybatis/**/*Mapper.xml
  typeAliasesPackage: com.login.**.domain
spring:
  thymeleaf:
    mode: LEGACYHTML5
    cache: false
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB
  devtools:
    restart:
      enabled: pro
  cache:
    type: ehcache
    ehcache:
      config: classpath:config/ehcache.xml
  datasource:
    #从库数量
    readSize: 2
    #使用druid数据源
    type: com.alibaba.druid.pool.DruidDataSource
    login:
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.1.24:3306/login?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT
      username: root
      password: G5p2DFP4bdRHiJ38
      initialSize: 1
      minIdle: 3
      maxActive: 20
      # 配置获取连接等待超时的时间
      maxWait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      timeBetweenEvictionRunsMillis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      minEvictableIdleTimeMillis: 30000
      validationQuery: select 'x'
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      # 打开PSCache，并且指定每个连接上PSCache的大小
      poolPreparedStatements: true
      maxPoolPreparedStatementPerConnectionSize: 20
      # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
      filters: stat,wall,slf4j
      # 通过connectProperties属性来打开mergeSql功能；慢SQL记录
      connectionProperties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
      # 合并多个DruidDataSource的监控数据
      #useGlobalDataSourceStat: true
    bms:
      driverClassName: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://192.168.1.24:3306/back?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=GMT
      username: root
      password: G5p2DFP4bdRHiJ38
      initialSize: 1
      minIdle: 3
