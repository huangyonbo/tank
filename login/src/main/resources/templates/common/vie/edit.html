<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
<div class="wrapper wrapper-content ">
    <div class="row">
        <div class="col-sm-12">
        	<input type="hidden" id="table_Id" th:value="${table}" /> 
            <input type="hidden" id="processDefinitionKey" th:value="${processDefinitionKey}" />
            <input type="hidden" id="taskId" th:value="${taskId}" />
            <div class="ibox float-e-margins">
                <div class="ibox-content">
                    <form class="form-horizontal m-t" id="common_form_id">
                    	<div class="form-group" th:each="data:${datas}">
                    		<div th:unless="${data.column eq 'id'}">
                    			<label class="col-sm-3 control-label" th:text="${data.label}" />
	                            <div class="col-sm-8">
	                                <input th:name="${data.column}" class="form-control" type="text">
	                            </div>
                    		</div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-8 col-sm-offset-3">
                                <button type="submit" class="btn btn-primary" onclick="pass()">同意</button>
                                <button type="submit" class="btn btn-primary" onclick="refuse()">拒绝</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:include="include::footer"></div>
<script type="text/javascript">
	function pass() {
		$.ajax({
			cache : true,
			type : "POST",
			url : "/common/normal/update",
			data : {
				table: $("#table_Id").val(),
				taskId: $("#taskId").val(),
                pass: true,
				datas: $("#common_form_id").serialize()
			},
			async : false,
			error : function(request) {
				parent.layer.alert("网络超时");
			},
			success : function(data) {
				if (data.code == 0) {
					parent.layer.msg("操作成功");
					//parent.reLoad();
					var index = parent.layer.getFrameIndex(window.name);
					parent.layer.close(index);
				} else {
					parent.layer.alert(data.msg)
				}
			}
		});
	}
    function refuse() {
        $.ajax({
            cache : true,
            type : "POST",
            url : "/common/normal/update",
            data : {
                table: $("#table_Id").val(),
                taskId: $("#taskId").val(),
                pass: false,
                datas: $("#common_form_id").serialize()
            },
            async : false,
            error : function(request) {
                parent.layer.alert("网络超时");
            },
            success : function(data) {
                if (data.code == 0) {
                    parent.layer.msg("操作成功");
                    var index = parent.layer.getFrameIndex(window.name);
                    parent.layer.close(index);
                } else {
                    parent.layer.alert(data.msg)
                }
            }
        });
    }
</script>
</body>
</html>
