<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="row">
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-content">
						<form class="form-horizontal m-t" id="signupForm">
							<div class="form-group">
								<label class="col-sm-3 control-label">配置key：</label>
								<div class="col-sm-8">
									<select id="id" name="id" class="form-control chosen-select">
										<option value="sysProp">系统参数</option>
										<option value="realName">实名认证参数</option>
										<option value="smsProp">短信参数</option>
										<option value="huaweiProp">华为参数</option>
										<option value="tencentProp">应用宝参数</option>
										<option value="xiaomiProp">小米参数</option>
										<option value="oppoProp">oppo参数</option>
										<option value="wechatProp">微信登录参数</option>
									</select>
								</div>
							</div>
							<div id="dataDivId">

							</div>
							<div class="form-group">
								<div class="col-sm-8 col-sm-offset-3">
									<button type="submit" class="btn btn-primary">提交</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
	</div>
	</div>
	<div th:include="include::footer"></div>
	<script type="text/javascript" src="/js/appjs/prop/propConfig/prop.js"></script>
	<script type="text/javascript" src="/js/appjs/prop/propConfig/add.js"></script>
</body>
</html>
