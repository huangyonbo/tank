<!DOCTYPE html>
<html>
<meta charset="utf-8">
<head th:include="include :: header"></head>
<body class="gray-bg">
	<div class="wrapper wrapper-content ">
		<div class="row">
			<div class="col-sm-12">
				<div class="ibox float-e-margins">
					<div class="ibox-content">
						<form class="form-horizontal m-t" id="signupForm">
						<input id="id" name="id" th:value="${limitIp.id}"  type="hidden">
							<div class="form-group">	
								<label class="col-sm-3 control-label">ip地址：</label>
								<div class="col-sm-8">
									<input id="ip" name="ip" th:value="${limitIp.ip}" class="form-control" type="text">
								</div>
							</div>
							<div class="form-group">
								<label class="col-sm-3 control-label">类型：</label>
								<div class="col-sm-8">
									<select id="type" name="type" class="form-control" onchange="typeChange(this)">
										<option value="0" th:selected="${limitIp.type == 0}">永久禁止登陆</option>
										<option value="1" th:selected="${limitIp.type == 1}">时间段禁止登陆</option>
										<option value="2" th:selected="${limitIp.type == 2}">维护白名单</option>
									</select>
								</div>
							</div>
							<div id="timeAreaId" hidden="true">
								<div class="form-group">
									<label class="col-sm-3 control-label">禁用开始时间：</label>
									<div class="col-sm-8">
										<input id="start" name="start" th:value="${limitIp.start}" class="form-control" type="text">
									</div>
								</div>
								<div class="form-group">
									<label class="col-sm-3 control-label">禁用结束时间：</label>
									<div class="col-sm-8">
										<input id="end" name="end" th:value="${limitIp.end}" class="form-control" type="text">
									</div>
								</div>
							</div>
							<div class="form-group">
								<div class="col-sm-8 col-sm-offset-3">
									<button type="submit" class="btn btn-primary">提交</button>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
	</div>
	</div>
	<div th:include="include::footer"></div>
	<script type="text/javascript" src="/js/appjs/ip/limitIp/edit.js">
	</script>
	<script src="/laydate/laydate.js"></script>
	<script type="text/javascript">
		$(function () {
			laydate.render({
				elem: '#start',
				type: 'datetime',
				format: 'yyyy-MM-dd HH:mm:ss'//日期格式
			});
			laydate.render({
				elem: '#end',
				type: 'datetime',
				format: 'yyyy-MM-dd HH:mm:ss'//日期格式
			});
		});
		function typeChange(obj){
			let options = $(obj).val();
			if (options == 1){
				$('#timeAreaId').show();
			}else{
				$('#timeAreaId').hide();
			}
		}
	</script>
</body>
</html>
