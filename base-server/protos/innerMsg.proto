
syntax = "proto2";

option java_package = "framework.net.message";

message SerInfo {
    optional string name = 1;
    optional string type = 2;
}

message SyncLoad {
	optional int32 load = 1;
}

message String {
	optional string value = 1;
}

message LoadPlayer {
	optional int32 uid = 1;
	optional int32 sex = 2;
	optional string name = 3;
	optional string headurl = 4;
	optional string addr = 5;
	optional string deviceId = 6;
	optional string deviceName = 7;
	optional string cliname = 8;
	optional string cliver = 9;
