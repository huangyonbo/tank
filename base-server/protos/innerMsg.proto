	optional string front = 11;
	optional int32 channel = 12;
	optional string payinfo = 13;
	optional string phoneBrand = 14;
	optional string phoneModel = 15;
	optional string phone = 16;
  optional string recruiter = 17;
  optional bool certification = 18;
  optional int32 age = 19;
  optional bool testPay = 20;
  optional int32 inviteVip = 21;
}

message RequestRoleData {
	optional int32 uid = 1;
	optional string headurl = 2;
	optional string addr = 3;
	optional string deviceId = 4;
	optional string deviceName = 5;
	optional string cliname = 6;
