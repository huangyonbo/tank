syntax = "proto2";

option java_package = "framework.net.message";

message Login {
	optional int32 id = 1;
	optional int32 uid = 2;
	optional string token = 3;
	optional string deviceName = 4;
	optional string deviceId = 5;
	optional string cliName = 6;
	optional string cliVer = 7;
	optional string macAddr = 8;
	optional string phoneBrand = 9;
	optional string phoneModel = 10;
	optional bool certification = 11;
	optional int32 age = 12;
	optional bool testPay=13;
}

message LoginRes {
	optional int32 code = 1;
	optional int32 uid = 2;
	optional string name = 3;
	optional string head = 4;
	optional int32 sex = 5;
}

message LoadObject {
	optional uint64 objectId = 1;
	optional int32 type = 2;
	optional bytes data = 3;
}

message DeleteObject {
	optional uint64 objectId = 1;
}

message CustomMsg {
	optional int32 msgid = 1;
	optional bytes data = 2;
}

message RequestMsg {
	optional int32 msgid = 1;
	optional int32 reqid = 2;
	optional bytes data = 3;
}

message ResponseMsg {
	optional int32 reqid = 1;
	optional bytes data = 2;
}

message PropertySync {
	optional uint64 objectId = 1;
	optional int32 count = 2;
	optional bytes data = 3;
}

message SyncOneProperty {
	optional uint64 objectId = 1;
	optional string name = 2;
	optional int32 type = 3;
	optional string value = 4;
}

message AddViewport {
	optional int32 viewid = 1;
	optional uint64 objectId = 2;
	optional bytes data = 3;
}

message RemoveViewport {
	optional int32 viewid = 1;
}

message LoadVpitem {
	optional int32 viewid = 1;
	optional int32 pos = 2;
	optional bytes data = 3;
}

message RemoveVpitem {
	optional int32 viewid = 1;
	optional int32 pos = 2;
}

message SyncVpitemPro {
	optional int32 viewid = 1;
	optional int32 pos = 2;
	optional int32 count = 3;
	optional bytes data = 4;
}

message RecAddRow{
	optional uint64 objectId = 1;
	optional string name = 2;
	optional int32 row = 3;
	optional bytes data = 4;
}

message RecDelRow{
	optional uint64 objectId = 1;
	optional string name = 2;
	optional int32 row = 3;
}

message RecClear{
	optional uint64 objectId = 1;
	optional string name = 2;
}

message RecSetVal{
	optional uint64 objectId = 1;
	optional string name = 2;
	optional int32 row = 3;
	optional int32 col = 4;
	optional bytes data = 5;
}

message AllocGate {
	required string addr = 1;
	required int32 port = 2;
}

message Kick {
	required int32 code = 1;	
}
